<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HTML to Markdown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>HTML → Markdown</h1>
      <p>Select an element on the page and convert it to Markdown.</p>
      <button id="start" type="button">Select element</button>
      <p class="hint">Tip: Click a table to convert it to a Markdown table.</p>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
